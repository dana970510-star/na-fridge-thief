<style>
:root{

  --ink:#27231f;

  --accent:#ff8a3d;
  --line:#eee1cf;
  --good:#3a9d5d;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  line-height:1.6;
}

button,input{font-family:inherit}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;

}

.wrap{

  margin:auto;

.nav-tabs{

  padding:10px 16px;

}

.nav-tab.active{

  color:var(--ink);
  box-shadow:0 4px 14px rgba(80,50,20,.08);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:0 8px 30px rgba(80,50,20,.06);

h2{

.help{

.inputrow{

input{

let ingredients=[];

/* =========================================================
   공통 함수
========================================================= */

function normalize(value){

 return String(value)
 .trim()
 .toLowerCase()
 .replace(/\s/g,"");

}


function renderTags(){

 const box=document.getElementById("tags");

 if(!ingredients.length){

  box.innerHTML="";
  return;

 }

 box.innerHTML=ingredients.map((item,index)=>`

  <span class="tag">

   ${item}

   <button
    type="button"
    data-remove="${index}"
   >×</button>

  </span>

 `).join("");

}


function addIngredient(){

 const input=document.getElementById("ingredientInput");

 const value=input.value.trim();

 if(!value){

  input.focus();
  return;

 }

 value
 .split(",")
 .map(v=>v.trim())
 .filter(Boolean)
 .forEach(v=>{

  if(
   !ingredients.some(
    x=>normalize(x)===normalize(v)
   )
  ){

   ingredients.push(v);

  }

 });

 input.value="";

 renderTags();

 input.focus();

}


function removeIngredient(index){

 ingredients.splice(index,1);

 renderTags();

}


function score(recipe){

 const have=ingredients.map(normalize);

 return recipe.ingredients.filter(
  x=>have.some(
   h=>
   h.includes(normalize(x)) ||
   normalize(x).includes(h)
  )
 ).length;

}


function getMissingIngredients(recipe){

 return recipe.ingredients.filter(
  x=>
  !ingredients.some(
   h=>
   normalize(h).includes(normalize(x)) ||
   normalize(x).includes(h)
  )
 );

}

  '<div class="card empty">🥷 먼저 냉장고 재료를 입력해주세요!</div>';

  return;

 }

 closeDetail();

 const ranked=

 recipes
 .map(r=>({...r,matched:score(r)}))
 .filter(r=>r.matched>0)
 .sort((a,b)=>b.matched-a.matched);

 renderResults(ranked.slice(0,6));

 document
 .getElementById("results")
 .scrollIntoView({
  behavior:"smooth",
  block:"start"
 });

}


function randomRecipe(){

  closeDetail();

  const r=
  recipes[Math.floor(Math.random()*recipes.length)];

  renderResults([r]);

  document
    .getElementById("results")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


function renderResults(list){

 const results=document.getElementById("results");

 if(!list.length){

  results.innerHTML=
  '<div class="card empty">🥷 털 수 있는 요리를 못 찾았어요.<br>재료를 조금 더 추가해보세요!</div>';

  return;

 }

 results.innerHTML=list.map(recipe=>{

  const missing=getMissingIngredients(recipe);

  const index=recipes.findIndex(
   r=>r.name===recipe.name
  );

  return `

  <article
   class="result"
   data-index="${index}"
   tabindex="0"
  >

   <h3>
    ${recipe.emoji} ${recipe.name}
   </h3>

   ${
    missing.length
    ?
    `<div class="result-missing">
      🛒 부족한 재료: ${missing.join(", ")}
     </div>`
    :
    `<div class="result-all">
      🎉 필요한 재료를 모두 가지고 있어요!
     </div>`
   }

   <div class="result-info">

    <span>⏱️ ${recipe.time}</span>

    <span>👩‍🍳 ${recipe.level}</span>

   </div>

   <div class="result-arrow">
    자세히 보기 →
   </div>

  </article>

  `;

 }).join("");

}


/* =========================================================
   상세 페이지
========================================================= */

function openDetail(index){

 const recipe=recipes[index];

 if(!recipe)return;

 currentRecipe=recipe;


 document
 .getElementById("detailTitle")
 .textContent=
 recipe.emoji+" "+recipe.name;


 document
 .getElementById("detailMeta")
 .innerHTML=`

  <span>
   ⏱️ 조리시간 ${recipe.time}
  </span>

  <span>
   👩‍🍳 난이도 ${recipe.level}
  </span>

 `;


 document
 .getElementById("detailIngredients")
 .innerHTML=
 recipe.ingredients
 .map(x=>`<li>${x}</li>`)
 .join("");


 document
 .getElementById("detailSteps")
 .innerHTML=
 recipe.steps
 .map(x=>`<li>${x}</li>`)
 .join("");


 document
 .getElementById("results")
 .style.display="none";


 document
 .getElementById("detailPage")
 .style.display="block";


 document
 .getElementById("detailPage")
 .scrollIntoView({
  behavior:"smooth",
  block:"start"
 });



}


function closeDetail(){

 currentRecipe=null;

 document
 .getElementById("detailPage")
 .style.display="none";

 document
 .getElementById("results")
 .style.display="grid";

}


/* =========================================================
   시작
========================================================= */

document.addEventListener(
 "DOMContentLoaded",
 async()=>{

  document
   .getElementById("addButton")
   .addEventListener(
    "click",
    addIngredient
   );


  document
   .getElementById("findButton")
   .addEventListener(
    "click",
    findRecipes
   );


  document
   .getElementById("backButton")
   .addEventListener(
    "click",
    closeDetail
   );


  document
   .getElementById("ingredientInput")
   .addEventListener(
    "keydown",
    e=>{

     if(e.key==="Enter"){

      e.preventDefault();

      addIngredient();

     }

    }
  );


  document
   .getElementById("tags")
   .addEventListener(
    "click",
    e=>{

     const btn=
     e.target.closest(
      "[data-remove]"
     );

     if(btn){

      removeIngredient(
       Number(btn.dataset.remove)
      );

     }

    }
  );


  document
   .getElementById("results")
   .addEventListener(
    "click",
    e=>{

     const card=
     e.target.closest(".result");

     if(card){

      openDetail(
       Number(card.dataset.index)
      );

     }

    }
  );


  document
   .getElementById("results")
   .addEventListener(
    "keydown",
    e=>{

     if(
      e.key!=="Enter" &&
      e.key!==" "
     )return;

     const card=
     e.target.closest(".result");

     if(card){

      e.preventDefault();

      openDetail(
       Number(card.dataset.index)
      );

     }

    }
  );


  renderTags();


  await handlePollinationsCallback();

 }
);

</script>
