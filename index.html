<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff7e8">
<title>냉장고털이범</title>

<style>
:root{
  --bg:#fff7e8;
  --card:#fff;
  --ink:#27231f;
  --muted:#766f67;
  --accent:#ff8a3d;
  --line:#eee1cf;
  --good:#3a9d5d;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  line-height:1.6;
}

button,input{font-family:inherit}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:22px 18px 60px;
}

.hero{
  text-align:center;
  padding:28px 8px 20px;
}

.logo{font-size:58px}

.badge{
  display:inline-block;
  background:#ffe0a8;
  padding:5px 12px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
}

h1{
  font-size:42px;
  line-height:1.1;
  margin:12px 0 8px;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:0 8px 30px rgba(80,50,20,.06);
}

h2{
  font-size:22px;
  margin:0 0 8px;
}

.help{
  font-size:14px;
  color:var(--muted);
  margin:0 0 15px;
}

.inputrow{
  display:flex;
  gap:9px;
}

input{
  flex:1;
  min-width:0;
  border:2px solid var(--line);
  border-radius:15px;
  padding:14px;
  font-size:16px;
  outline:none;
  background:#fff;
}

input:focus{
  border-color:var(--accent);
}

button{
  border-radius:15px;
  padding:13px 16px;
  font-size:15px;
  font-weight:800;
}

.add{
  background:#f1ece4;
  color:var(--ink);
}

.primary{
  width:100%;
  background:var(--accent);
  color:#fff;
  margin-top:13px;
  font-size:17px;
}

.random{
  width:100%;
  background:#fff0cf;
  color:#704600;
  margin-top:9px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.tag{
  background:#fff0cf;
  border:1px solid #f3d49c;
  border-radius:999px;
  padding:7px 11px;
  font-size:14px;
}

.tag button{
  padding:0 0 0 7px;
  background:none;
  font-size:16px;
  color:#9a6b35;
}

.results{
  margin-top:20px;
  display:grid;
  gap:14px;
}

.result{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(255,138,61,.15);
  box-shadow:0 5px 18px rgba(80,50,20,.04);
}

.result:active{
  transform:scale(.99);
}

.result h3{
  font-size:21px;
  margin:0;
}

.result-missing{
  color:#a65d24;
  font-size:14px;
  margin-top:10px;
}

.result-all{
  color:var(--good);
  font-size:14px;
  font-weight:800;
  margin-top:10px;
}

.result-info{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.result-info span{
  background:#f7f2ea;
  border-radius:999px;
  padding:5px 10px;
  font-size:13px;
}

.result-arrow{
  text-align:right;
  color:#999;
  font-size:13px;
  margin-top:10px;
}

.detail-page{
  display:none;
  margin-top:20px;
}

.detail-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(80,50,20,.06);
}

.detail-image{
  width:100%;
  height:320px;
  background:linear-gradient(135deg,#fff0cf,#ffe0a8);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.detail-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.image-placeholder{
  text-align:center;
  color:#9a7650;
  padding:25px;
}

.food-emoji{
  display:block;
  font-size:80px;
  line-height:1;
  margin-bottom:12px;
}

.image-placeholder p{
  margin:0;
  font-size:14px;
}

.ai-loading{
  text-align:center;
  color:#8b633e;
}

.ai-spinner{
  width:45px;
  height:45px;
  border:5px solid rgba(255,138,61,.2);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:0 auto 15px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.ai-login{
  background:#fff;
  border:1px solid #f1d8b5;
  border-radius:18px;
  padding:18px;
  margin:18px;
  text-align:center;
}

.ai-login p{
  margin:0 0 12px;
  color:var(--muted);
  font-size:14px;
}

.ai-login button{
  background:var(--accent);
  color:white;
  width:100%;
}

.detail-content{
  padding:22px;
}

.detail-title{
  font-size:30px;
  line-height:1.3;
  margin:0 0 12px;
}

.detail-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.detail-meta span{
  background:#f7f2ea;
  border-radius:999px;
  padding:6px 11px;
  font-size:13px;
}

.detail-section{
  margin-top:24px;
}

.detail-section h3{
  font-size:20px;
  margin:0 0 10px;
}

.ingredients-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  list-style:none;
  padding:0;
  margin:0;
}

.ingredients-list li{
  background:#fff0cf;
  border:1px solid #f3d49c;
  border-radius:999px;
  padding:7px 11px;
  font-size:14px;
}

.steps{
  margin:0;
  padding-left:24px;
}

.steps li{
  margin-bottom:10px;
}

.back-button{
  width:100%;
  background:#f1ece4;
  color:var(--ink);
  margin-top:24px;
  font-size:16px;
}

.delivery-card{
  margin-top:16px;
}

.delivery-btn{
  background:#6c63ff!important;
}

.delivery-result{
  margin-top:14px;
  background:#f7f3ff;
  border-radius:18px;
  padding:16px;
}

.delivery-result h3{
  margin:0 0 5px;
  font-size:20px;
}

.delivery-result p{
  margin:4px 0;
  color:var(--muted);
  font-size:14px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:20px;
}

.note{
  margin-top:18px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.ai-note{
  text-align:center;
  color:#9a7650;
  font-size:12px;
  margin-top:10px;
}

@media(max-width:520px){

  h1{
    font-size:36px;
  }

  .logo{
    font-size:50px;
  }

  .inputrow{
    flex-wrap:wrap;
  }

  .inputrow input{
    flex-basis:100%;
  }

  .add{
    width:100%;
  }

  .card{
    padding:18px;
  }

  .detail-image{
    height:230px;
  }

  .detail-title{
    font-size:26px;
  }
}
</style>
</head>

<body>

<main class="wrap">

<section class="hero">
  <div class="logo">🥷</div>
  <span class="badge">냉장고 털기 전문</span>
  <h1>냉장고털이범</h1>
  <p>
    냉장고 속 재료를 입력하면<br>
    만들 수 있는 요리를 찾아드립니다.
  </p>
</section>


<section class="card">

  <h2>🥕 냉장고에 뭐가 있나요?</h2>

  <p class="help">
    재료를 하나씩 입력해 주세요. 예: 계란, 양배추, 두부
  </p>

  <div class="inputrow">
    <input
      id="ingredientInput"
      placeholder="재료를 입력하세요"
      autocomplete="off"
    >

    <button type="button" class="add" id="addButton">
      ➕ 추가
    </button>
  </div>

  <div id="tags" class="tags"></div>

  <button type="button" class="primary" id="findButton">
    🔪 냉장고 털기!
  </button>

  <button type="button" class="random" id="randomButton">
    🎲 아무거나 털어줘!
  </button>

</section>


<section class="card delivery-card">

  <h2>🍕 오늘은 요리하기 싫어요</h2>

  <p class="help">
    그럴 땐 냉장고털이범이 배달 메뉴도 골라드립니다.
  </p>

  <button
    type="button"
    id="deliveryBtn"
    class="primary delivery-btn"
  >
    🛵 배달음식 추천받기
  </button>

  <div id="deliveryResult"></div>

</section>


<section id="results" class="results"></section>


<section id="detailPage" class="detail-page">

  <div class="detail-card">

    <div id="detailImage" class="detail-image"></div>

    <div class="detail-content">

      <h2 id="detailTitle" class="detail-title"></h2>

      <div id="detailMeta" class="detail-meta"></div>


      <div class="detail-section">

        <h3>🥕 필요한 재료</h3>

        <ul
          id="detailIngredients"
          class="ingredients-list"
        ></ul>

      </div>


      <div class="detail-section">

        <h3>👩‍🍳 조리 방법</h3>

        <ol id="detailSteps" class="steps"></ol>

      </div>


      <button
        type="button"
        id="backButton"
        class="back-button"
      >
        ← 요리 목록으로 돌아가기
      </button>

    </div>

  </div>

</section>


<p class="note">
  ※ AI 음식 사진은 Pollinations를 통해 자동으로 생성됩니다.
</p>

</main>

 imagePrompt:"한국식 양배추 계란전. 잘게 채 썬 양배추와 계란물을 섞어서 프라이팬에 둥글고 납작하게 부친 한국식 전. 전의 표면은 노릇한 황금빛이고 가장자리는 살짝 바삭하게 익어 있다. 노란 계란 사이로 잘게 썬 양배추와 초록색 대파 조각이 선명하게 보인다. 흰색 접시에 둥글고 납작한 양배추 계란전 2~3장이 담겨 있다. 이것은 절대 볶음밥이나 볶음요리가 아니다. 면 없음. 국수 없음. 닭고기 없음. 당근 없음. 찌개 없음. 고기 없음. 다른 음식 없음.",
 steps:[
  "양배추를 잘게 썬다.",
  "계란과 대파를 넣고 섞는다.",
  "팬에 한 국자씩 올린다.",
  "앞뒤로 노릇하게 부친다."
 ]
}

];

const deliveryMenus=[

["🍗","치킨","바삭한 치킨 + 사이드","오늘은 제대로 먹고 싶은 날"],

["🍕","피자","피자 + 사이드 메뉴","여럿이 먹기 좋은 메뉴"],

["🍜","중식","짜장면 또는 짬뽕 + 탕수육","든든하고 자극적인 게 당기는 날"],

["🍣","초밥","초밥 또는 연어덮밥","깔끔하게 먹고 싶은 날"],

["🌮","분식","떡볶이 + 튀김 + 김밥","여러 가지 조금씩 먹고 싶은 날"],

["🍖","족발/보쌈","족발 또는 보쌈 + 막국수","푸짐하게 먹고 싶은 날"],

["🍔","햄버거","버거 + 감자튀김","간단하고 확실하게 먹고 싶은 날"],

["🍲","찌개/찜","김치찌개 또는 닭볶음탕","따뜻한 음식이 필요한 날"]

];


let ingredients=[];

let currentRecipe=null;


/* =========================================================
   공통 함수
========================================================= */

function normalize(value){

 return String(value)
 .trim()
 .toLowerCase()
 .replace(/\s/g,"");

}


function renderTags(){

 const box=document.getElementById("tags");

 if(!ingredients.length){

  box.innerHTML="";
  return;

 }

 box.innerHTML=ingredients.map((item,index)=>`

  <span class="tag">

   ${item}

   <button
    type="button"
    data-remove="${index}"
   >×</button>

  </span>

 `).join("");

}


function addIngredient(){

 const input=document.getElementById("ingredientInput");

 const value=input.value.trim();

 if(!value){

  input.focus();
  return;

 }

 value
 .split(",")
 .map(v=>v.trim())
 .filter(Boolean)
 .forEach(v=>{

  if(
   !ingredients.some(
    x=>normalize(x)===normalize(v)
   )
  ){

   ingredients.push(v);

  }

 });

 input.value="";

 renderTags();

 input.focus();

}


function removeIngredient(index){

 ingredients.splice(index,1);

 renderTags();

}


function score(recipe){

 const have=ingredients.map(normalize);

 return recipe.ingredients.filter(
  x=>have.some(
   h=>
   h.includes(normalize(x)) ||
   normalize(x).includes(h)
  )
 ).length;

}


function getMissingIngredients(recipe){

 return recipe.ingredients.filter(
  x=>
  !ingredients.some(
   h=>
   normalize(h).includes(normalize(x)) ||
   normalize(x).includes(h)
  )
 );

}


/* =========================================================
   요리 검색
========================================================= */

function findRecipes(){

 if(!ingredients.length){

  document.getElementById("results").innerHTML=
  '<div class="card empty">🥷 먼저 냉장고 재료를 입력해주세요!</div>';

  return;

 }

 closeDetail();

 const ranked=

 recipes
 .map(r=>({...r,matched:score(r)}))
 .filter(r=>r.matched>0)
 .sort((a,b)=>b.matched-a.matched);

 renderResults(ranked.slice(0,6));

 document
 .getElementById("results")
 .scrollIntoView({
  behavior:"smooth",
  block:"start"
 });

}


function randomRecipe(){

 closeDetail();

 const r=
 recipes[Math.floor(Math.random()*recipes.length)];

 renderResults([r]);

 document
 .getElementById("results")
 .scrollIntoView({
  behavior:"smooth",
  block:"start"
 });

}


function renderResults(list){

 const results=document.getElementById("results");

 if(!list.length){

  results.innerHTML=
  '<div class="card empty">🥷 털 수 있는 요리를 못 찾았어요.<br>재료를 조금 더 추가해보세요!</div>';

  return;

 }

 results.innerHTML=list.map(recipe=>{

  const missing=getMissingIngredients(recipe);

  const index=recipes.findIndex(
   r=>r.name===recipe.name
  );

  return `

  <article
   class="result"
   data-index="${index}"
   tabindex="0"
  >

   <h3>
    ${recipe.emoji} ${recipe.name}
   </h3>

   ${
    missing.length
    ?
    `<div class="result-missing">
      🛒 부족한 재료: ${missing.join(", ")}
     </div>`
    :
    `<div class="result-all">
      🎉 필요한 재료를 모두 가지고 있어요!
     </div>`
   }

   <div class="result-info">

    <span>⏱️ ${recipe.time}</span>

    <span>👩‍🍳 ${recipe.level}</span>

   </div>

   <div class="result-arrow">
    자세히 보기 →
   </div>

  </article>

  `;

 }).join("");

}


/* =========================================================
   🔐 PKCE 인증
========================================================= */

function randomString(length=64){

 const chars=
 "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

 const array=
 new Uint8Array(length);

 crypto.getRandomValues(array);

 return Array.from(array)
 .map(x=>chars[x%chars.length])
 .join("");

}


function base64UrlEncode(buffer){

 return btoa(
  String.fromCharCode(...new Uint8Array(buffer))
 )
 .replace(/\+/g,"-")
 .replace(/\//g,"_")
 .replace(/=+$/,"");

}


async function createPKCE(){

 const verifier=randomString(64);

 const digest=
 await crypto.subtle.digest(
  "SHA-256",
  new TextEncoder().encode(verifier)
 );

 const challenge=
 base64UrlEncode(digest);

 return {
  verifier,
  challenge
 };

}


async function startPollinationsLogin(){

 if(
  !POLLINATIONS_CLIENT_ID ||
  POLLINATIONS_CLIENT_ID.includes("여기에_")
 ){

  alert(
   "먼저 코드 맨 위의 Pollinations App Key를 입력해주세요."
  );

  return;

 }

 const {
  verifier,
  challenge
 }=await createPKCE();

 const state=randomString(32);

 sessionStorage.setItem(
  "pollinations_verifier",
  verifier
 );

 sessionStorage.setItem(
  "pollinations_state",
  state
 );

 const redirectUri=
 location.origin+
 location.pathname;

 const params=new URLSearchParams({

  response_type:"code",

  client_id:POLLINATIONS_CLIENT_ID,

  redirect_uri:redirectUri,

  scope:"usage",

  state:state,

  code_challenge:challenge,

  code_challenge_method:"S256",

  models:"black-forest-labs/flux.1-schnell",

  expiry:"7",

  budget:"5"

 });

 location.href=
 "https://enter.pollinations.ai/authorize?"+
 params.toString();

}


/* =========================================================
   인증 콜백 처리
========================================================= */

async function handlePollinationsCallback(){

 const params=
 new URLSearchParams(location.search);

 const code=params.get("code");

 const state=params.get("state");

 if(!code){

  return;

 }

 const savedState=
 sessionStorage.getItem("pollinations_state");

 const verifier=
 sessionStorage.getItem("pollinations_verifier");

 if(
  !savedState ||
  !verifier ||
  state!==savedState
 ){

  alert("인증 정보를 확인할 수 없습니다.");

  return;

 }

 try{

  const redirectUri=
  location.origin+
  location.pathname;

  const response=
  await fetch(
   "https://enter.pollinations.ai/api/oauth/token",
   {
    method:"POST",

    headers:{
     "Content-Type":
     "application/x-www-form-urlencoded"
    },

    body:new URLSearchParams({

     grant_type:
     "authorization_code",

     code:code,

     client_id:
     POLLINATIONS_CLIENT_ID,

     redirect_uri:
     redirectUri,

     code_verifier:
     verifier

    })

   }
  );


  const data=
  await response.json();


  if(!response.ok){

   console.error(data);

   alert(
    "Pollinations 인증에 실패했어요."
   );

   return;

  }


  sessionStorage.setItem(
   "pollinations_token",
   data.access_token
  );


  sessionStorage.removeItem(
   "pollinations_state"
  );

  sessionStorage.removeItem(
   "pollinations_verifier"
  );


  history.replaceState(
   {},
   document.title,
   redirectUri
  );


  if(currentRecipe){

   generateFoodImage(currentRecipe);

  }

 }catch(error){

  console.error(error);

  alert(
   "AI 인증 처리 중 문제가 발생했어요."
  );

 }

}


/* =========================================================
   AI 음식 사진 생성
========================================================= */

async function generateFoodImage(recipe){

 const imageBox=
 document.getElementById("detailImage");

 const token=
 sessionStorage.getItem(
  "pollinations_token"
 );


 if(!token){

  imageBox.innerHTML=`

   <div class="ai-login">

    <div style="font-size:55px">
     ${recipe.emoji}
    </div>

    <p>
     이 요리의 실제 음식 사진을<br>
     AI로 만들어볼까요?
    </p>

    <button
     type="button"
     id="aiLoginButton"
    >
     🤖 AI 음식 사진 만들기
    </button>

   </div>

  `;

  document
   .getElementById("aiLoginButton")
   .onclick=
   startPollinationsLogin;

  return;

 }


 imageBox.innerHTML=`

  <div class="ai-loading">

   <div class="ai-spinner"></div>

   <strong>AI가 음식을 만들고 있어요 🍳</strong>

   <p>
    잠깐만 기다려주세요!
   </p>

  </div>

 `;


 const prompt=
 `Photorealistic Korean home-cooked food photography of ${recipe.name}.
 Beautifully plated on a clean ceramic plate,
 warm natural lighting,
 appetizing,
 realistic ingredients,
 Korean home meal style,
 close-up food photography,
 no people,
 no text,
 no letters,
 no watermark.`;

 try{

  const url=
  "https://gen.pollinations.ai/image/"+
  encodeURIComponent(prompt)+
  "?model=black-forest-labs%2Fflux.1-schnell"+
  "&width=1024"+
  "&height=768"+
  "&nologo=true";


  const response=
  await fetch(
   url,
   {
    headers:{
     Authorization:
     "Bearer "+token
    }
   }
  );


  if(!response.ok){

   if(response.status===401){

    sessionStorage.removeItem(
     "pollinations_token"
    );

    imageBox.innerHTML=`

     <div class="ai-login">

      <div style="font-size:55px">
       ${recipe.emoji}
      </div>

      <p>
       AI 인증이 만료되었어요.<br>
       다시 연결해주세요.
      </p>

      <button
       type="button"
       id="aiLoginButton"
      >
       🔐 다시 연결하기
      </button>

     </div>

    `;

    document
     .getElementById("aiLoginButton")
     .onclick=
     startPollinationsLogin;

    return;

   }

   throw new Error(
    "Image generation failed: "+
    response.status
   );

  }


  const blob=
  await response.blob();

  const imageUrl=
  URL.createObjectURL(blob);


  imageBox.innerHTML=`

   <img
    src="${imageUrl}"
    alt="${recipe.name} AI 음식 사진"
   >

  `;

 }catch(error){

  console.error(error);

  imageBox.innerHTML=`

   <div class="image-placeholder">

    <span class="food-emoji">
     ${recipe.emoji}
    </span>

    <p>
     AI 사진을 불러오지 못했어요.<br>
     다시 상세 페이지를 열어주세요.
    </p>

   </div>

  `;

 }

}


/* =========================================================
   상세 페이지
========================================================= */

function openDetail(index){

 const recipe=recipes[index];

 if(!recipe)return;

 currentRecipe=recipe;


 document
 .getElementById("detailTitle")
 .textContent=
 recipe.emoji+" "+recipe.name;


 document
 .getElementById("detailMeta")
 .innerHTML=`

  <span>
   ⏱️ 조리시간 ${recipe.time}
  </span>

  <span>
   👩‍🍳 난이도 ${recipe.level}
  </span>

 `;


 document
 .getElementById("detailIngredients")
 .innerHTML=
 recipe.ingredients
 .map(x=>`<li>${x}</li>`)
 .join("");


 document
 .getElementById("detailSteps")
 .innerHTML=
 recipe.steps
 .map(x=>`<li>${x}</li>`)
 .join("");


 document
 .getElementById("results")
 .style.display="none";


 document
 .getElementById("detailPage")
 .style.display="block";


 document
 .getElementById("detailPage")
 .scrollIntoView({
  behavior:"smooth",
  block:"start"
 });


 generateFoodImage(recipe);

}


function closeDetail(){

 currentRecipe=null;

 document
 .getElementById("detailPage")
 .style.display="none";

 document
 .getElementById("results")
 .style.display="grid";

}


/* =========================================================
   배달 추천
========================================================= */

function recommendDelivery(){

 const r=
 deliveryMenus[
  Math.floor(
   Math.random()*
   deliveryMenus.length
  )
 ];


 document
 .getElementById("deliveryResult")
 .innerHTML=`

  <div class="delivery-result">

   <h3>
    ${r[0]} ${r[1]}
   </h3>

   <p>
    🍴 추천 메뉴: ${r[2]}
   </p>

   <p>
    💡 ${r[3]}
   </p>

   <p>
    🥷 오늘은 요리 대신 배달로 털어버립시다!
   </p>

  </div>

 `;

}


/* =========================================================
   시작
========================================================= */

document.addEventListener(
 "DOMContentLoaded",
 async()=>{

  document
   .getElementById("addButton")
   .addEventListener(
    "click",
    addIngredient
   );


  document
   .getElementById("findButton")
   .addEventListener(
    "click",
    findRecipes
   );


  document
   .getElementById("randomButton")
   .addEventListener(
    "click",
    randomRecipe
   );


  document
   .getElementById("deliveryBtn")
   .addEventListener(
    "click",
    recommendDelivery
   );


  document
   .getElementById("backButton")
   .addEventListener(
    "click",
    closeDetail
   );


  document
   .getElementById("ingredientInput")
   .addEventListener(
    "keydown",
    e=>{

     if(e.key==="Enter"){

      e.preventDefault();

      addIngredient();

     }

    }
  );


  document
   .getElementById("tags")
   .addEventListener(
    "click",
    e=>{

     const btn=
     e.target.closest(
      "[data-remove]"
     );

     if(btn){

      removeIngredient(
       Number(btn.dataset.remove)
      );

     }

    }
  );


  document
   .getElementById("results")
   .addEventListener(
    "click",
    e=>{

     const card=
     e.target.closest(".result");

     if(card){

      openDetail(
       Number(card.dataset.index)
      );

     }

    }
  );


  document
   .getElementById("results")
   .addEventListener(
    "keydown",
    e=>{

     if(
      e.key!=="Enter" &&
      e.key!==" "
     )return;

     const card=
     e.target.closest(".result");

     if(card){

      e.preventDefault();

      openDetail(
       Number(card.dataset.index)
      );

     }

    }
  );


  renderTags();


  await handlePollinationsCallback();

 }
);

</script>
