<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff7e8">
<title>냉장고털이범</title>
<style>
:root{--bg:#fff7e8;--card:#fff;--ink:#27231f;--muted:#766f67;--accent:#ff8a3d;--accent2:#ffd166;--line:#eee1cf;--good:#3a9d5d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:auto;padding:22px 18px 60px}
.hero{text-align:center;padding:28px 8px 20px}
.logo{font-size:58px}
.badge{display:inline-block;background:#ffe0a8;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800}
h1{font-size:42px;line-height:1.1;margin:12px 0 8px}
.hero p{margin:0;color:var(--muted);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 8px 30px rgba(80,50,20,.06)}
h2{font-size:22px;margin:0 0 8px}
.help{font-size:14px;color:var(--muted);margin:0 0 15px}
.inputrow{display:flex;gap:9px}
input{flex:1;min-width:0;border:2px solid var(--line);border-radius:15px;padding:14px;font-size:16px;outline:none;background:#fff}
input:focus{border-color:var(--accent)}
button{display:block;appearance:none;-webkit-appearance:none;border:0;border-radius:15px;padding:13px 16px;font-size:15px;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08);user-select:none;-webkit-user-select:none;position:relative;z-index:10}
.add{background:#f1ece4;color:var(--ink)}
.primary{width:100%;background:var(--accent);color:#fff;margin-top:13px;font-size:17px}
.random{width:100%;background:#fff0cf;color:#704600;margin-top:9px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:20px}
.tag{background:#fff0cf;border:1px solid #f3d49c;border-radius:999px;padding:7px 11px;font-size:14px}
.tag button{padding:0 0 0 7px;background:none;font-size:16px;color:#9a6b35}
.results{margin-top:20px;display:grid;gap:14px}
.result{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}
.result h3{font-size:21px;margin:0 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 13px}
.meta span{background:#f7f2ea;border-radius:999px;padding:5px 9px;font-size:12px}
.match{color:var(--good);font-weight:800;font-size:14px}
.missing{color:#a65d24;font-size:13px;margin-top:5px}
.result ol{padding-left:22px;margin:12px 0 0}
.empty{text-align:center;color:var(--muted);padding:20px}
.note{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}
.delivery-card{margin-top:16px}.delivery-btn{background:#6c63ff!important}.delivery-result{margin-top:14px;background:#f7f3ff;border-radius:18px;padding:16px}.delivery-result h3{margin:0 0 5px;font-size:20px}.delivery-result p{margin:4px 0;color:var(--muted);font-size:14px}\n@media(max-width:520px){h1{font-size:36px}.logo{font-size:50px}.inputrow{flex-wrap:wrap}.inputrow input{flex-basis:100%}.add{width:100%}.card{padding:18px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div class="logo">🥷</div>
<span class="badge">냉장고 털기 전문</span>
<h1>냉장고털이범</h1>
<p>냉장고 속 재료를 입력하면<br>만들 수 있는 요리를 찾아드립니다.</p>
</section>

<section class="card">
<h2>🥕 냉장고에 뭐가 있나요?</h2>
<p class="help">재료를 하나씩 입력해 주세요. 예: 계란, 양배추, 두부</p>
<div class="inputrow">
<input id="ingredientInput" placeholder="재료를 입력하세요" autocomplete="off">
<button type="button" class="add" onclick="addIngredient()">➕ 추가</button>
</div>
<div id="tags" class="tags"></div>
<button type="button" class="primary" onclick="findRecipes()">🔪 냉장고 털기!</button>
<button type="button" class="random" onclick="randomRecipe()">🎲 아무거나 털어줘!</button>
</section>

<section class="card delivery-card">
<h2>🍕 오늘은 요리하기 싫어요</h2>
<p class="help">그럴 땐 냉장고털이범이 배달 메뉴도 골라드립니다.</p>
<button type="button" id="deliveryBtn" class="primary delivery-btn">🛵 배달음식 추천받기</button>
<div id="deliveryResult"></div>
</section>

<section id="results" class="results"></section>
<p class="note">※ 현재 버전은 미리 등록된 요리 데이터로 추천합니다.</p>
</main>

<script>
const recipes=[
{name:"참치 계란볶음",ingredients:["참치","계란","양파","대파"],time:"10분",level:"쉬움",steps:["계란을 풀어준다.","양파와 대파를 먹기 좋게 썬다.","팬에 양파와 대파를 볶고 참치를 넣는다.","계란물을 넣고 익혀준다.","소금이나 간장으로 간을 맞춘다."]},
{name:"두부 계란부침",ingredients:["두부","계란","대파"],time:"10분",level:"쉬움",steps:["두부의 물기를 빼고 먹기 좋은 크기로 자른다.","계란을 풀고 대파를 넣는다.","두부에 계란물을 입힌다.","팬에 앞뒤로 노릇하게 부친다."]},
{name:"닭가슴살 양배추볶음",ingredients:["닭가슴살","양배추","양파","대파"],time:"15분",level:"쉬움",steps:["양배추와 양파를 썬다.","닭가슴살을 먹기 좋은 크기로 자른다.","팬에 닭가슴살과 채소를 볶는다.","소금, 후추 또는 간장으로 간한다."]},
{name:"김치 두부찌개",ingredients:["김치","두부","대파","양파"],time:"20분",level:"보통",steps:["김치와 양파를 냄비에 넣고 볶는다.","물을 넣고 끓인다.","두부를 넣고 5분 정도 끓인다.","대파를 넣고 간을 맞춘다."]},
{name:"간장 계란밥",ingredients:["계란","밥","대파"],time:"5분",level:"매우 쉬움",steps:["계란을 프라이한다.","따뜻한 밥 위에 계란을 올린다.","간장과 참기름을 넣는다.","대파를 올려 비벼 먹는다."]},
{name:"두부 김치볶음",ingredients:["두부","김치","양파","대파"],time:"15분",level:"쉬움",steps:["두부를 데치거나 구워 준비한다.","김치와 양파를 볶는다.","대파를 넣고 함께 볶는다.","두부와 함께 담아낸다."]},
{name:"참치 김치볶음밥",ingredients:["참치","김치","밥","대파","계란"],time:"15분",level:"쉬움",steps:["대파를 볶아 향을 낸다.","김치와 참치를 넣고 볶는다.","밥을 넣고 골고루 볶는다.","마지막에 계란 프라이를 올린다."]},
{name:"양배추 계란전",ingredients:["양배추","계란","대파"],time:"10분",level:"쉬움",steps:["양배추를 잘게 썬다.","계란과 대파를 넣고 섞는다.","팬에 한 국자씩 올린다.","앞뒤로 노릇하게 부친다."]}
];

const deliveryMenus=[
["🍗","치킨","바삭한 치킨 + 사이드","오늘은 제대로 먹고 싶은 날"],
["🍕","피자","피자 + 사이드 메뉴","여럿이 먹기 좋은 메뉴"],
["🍜","중식","짜장면 또는 짬뽕 + 탕수육","든든하고 자극적인 게 당기는 날"],
["🍣","초밥","초밥 또는 연어덮밥","깔끔하게 먹고 싶은 날"],
["🌮","분식","떡볶이 + 튀김 + 김밥","여러 가지 조금씩 먹고 싶은 날"],
["🍖","족발/보쌈","족발 또는 보쌈 + 막국수","푸짐하게 먹고 싶은 날"],
["🍔","햄버거","버거 + 감자튀김","간단하고 확실하게 먹고 싶은 날"],
["🍲","찌개/찜","김치찌개 또는 닭볶음탕","따뜻한 음식이 필요한 날"]
];

let ingredients=[];

function normalize(s){return String(s).trim().toLowerCase().replace(/\s/g,"");}

function renderTags(){
 const box=document.getElementById("tags");
 if(!ingredients.length){box.innerHTML="";return;}
 box.innerHTML=ingredients.map((x,i)=>`<span class="tag">${x}<button type="button" data-remove="${i}">×</button></span>`).join("");
}

function addIngredient(){
 const input=document.getElementById("ingredientInput");
 const value=input.value.trim();
 if(!value){input.focus();return;}
 value.split(",").map(v=>v.trim()).filter(Boolean).forEach(v=>{
   if(!ingredients.some(x=>normalize(x)===normalize(v))) ingredients.push(v);
 });
 input.value="";
 renderTags();
 input.focus();
}

function removeIngredient(i){
 ingredients.splice(i,1);
 renderTags();
}

function score(recipe){
 const have=ingredients.map(normalize);
 return recipe.ingredients.filter(x=>have.some(h=>h.includes(normalize(x))||normalize(x).includes(h))).length;
}

function findRecipes(){
 const out=document.getElementById("results");
 if(!ingredients.length){
   out.innerHTML='<div class="card empty">🥷 먼저 냉장고 재료를 입력해주세요!</div>';
   return;
 }
 const ranked=recipes.map(r=>({...r,matched:score(r)}))
   .filter(r=>r.matched>0)
   .sort((a,b)=>b.matched-a.matched);
 renderResults(ranked.slice(0,6));
 out.scrollIntoView({behavior:"smooth",block:"start"});
}

function randomRecipe(){
 const r=recipes[Math.floor(Math.random()*recipes.length)];
 renderResults([{...r,matched:score(r)}]);
 document.getElementById("results").scrollIntoView({behavior:"smooth",block:"start"});
}

function renderResults(list){
 const out=document.getElementById("results");
 if(!list.length){
   out.innerHTML='<div class="card empty">🥷 털 수 있는 요리를 못 찾았어요.<br>재료를 조금 더 추가해보세요!</div>';
   return;
 }
 out.innerHTML=list.map(r=>{
   const missing=r.ingredients.filter(x=>!ingredients.some(h=>normalize(h).includes(normalize(x))||normalize(x).includes(normalize(h))));
   const percent=Math.round(r.matched/r.ingredients.length*100);
   return `<article class="result">
   <h3>🍳 ${r.name}</h3>
   <div class="match">⭐ 보유 재료 일치율 ${percent}% (${r.matched}/${r.ingredients.length})</div>
   <div class="meta"><span>⏱️ ${r.time}</span><span>👩‍🍳 난이도 ${r.level}</span></div>
   ${missing.length?`<div class="missing">🛒 부족한 재료: ${missing.join(", ")}</div>`:`<div class="match">🎉 필요한 재료를 모두 가지고 있어요!</div>`}
   <ol>${r.steps.map(step=>`<li>${step}</li>`).join("")}</ol>
   </article>`;
 }).join("");
}

function recommendDelivery(){
 const r=deliveryMenus[Math.floor(Math.random()*deliveryMenus.length)];
 document.getElementById("deliveryResult").innerHTML=
 `<div class="delivery-result"><h3>${r[0]} ${r[1]}</h3><p>🍴 추천 메뉴: ${r[2]}</p><p>💡 ${r[3]}</p><p>🥷 오늘은 요리 대신 배달로 털어버립시다!</p></div>`;
}

document.addEventListener("DOMContentLoaded",()=>{
 document.getElementById("ingredientInput").addEventListener("keydown",e=>{
   if(e.key==="Enter"){e.preventDefault();addIngredient();}
 });
 document.getElementById("tags").addEventListener("click",e=>{
   const btn=e.target.closest("[data-remove]");
   if(btn) removeIngredient(Number(btn.dataset.remove));
 });
 document.getElementById("deliveryBtn").addEventListener("click",recommendDelivery);
 renderTags();
});
</script>
</body>
</html>
