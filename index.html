<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff7e8">
<title>냉장고털이범</title>

<style>
:root{
  --bg:#fff7e8;
  --card:#fff;
  --ink:#27231f;
  --muted:#766f67;
  --accent:#ff8a3d;
  --line:#eee1cf;
  --good:#3a9d5d;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  line-height:1.6;
}

button,input{font-family:inherit}

button{
  border:0;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:22px 18px 60px;
}

.hero{
  text-align:center;
  padding:28px 8px 20px;
}

.logo{font-size:58px}


h1{
  font-size:42px;
  line-height:1.1;
  margin:12px 0 8px;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:16px;
}

.nav-tabs{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:24px;
}

.nav-tab{
  background:transparent;
  color:var(--muted);
  border-radius:999px;
  padding:10px 16px;
  font-size:14px;
}

.nav-tab.active{
  background:#fff;
  color:var(--ink);
  box-shadow:0 4px 14px rgba(80,50,20,.08);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:0 8px 30px rgba(80,50,20,.06);
}

h2{
  font-size:22px;
  margin:0 0 8px;
}

.help{
  font-size:14px;
  color:var(--muted);
  margin:0 0 15px;
}

.inputrow{
  display:flex;
  gap:9px;
}

input{
  flex:1;
  min-width:0;
  border:2px solid var(--line);
  border-radius:15px;
  padding:14px;
  font-size:16px;
  outline:none;
  background:#fff;
}

input:focus{
  border-color:var(--accent);
}

button{
  border-radius:15px;
  padding:13px 16px;
  font-size:15px;
  font-weight:800;
}

.add{
  background:#f1ece4;
  color:var(--ink);
}

.primary{
  width:100%;
  background:var(--accent);
  color:#fff;
  margin-top:13px;
  font-size:17px;
}

.random{
  width:100%;
  background:#fff0cf;
  color:#704600;
  margin-top:9px;
}


.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.tag{
  background:#fff0cf;
  border:1px solid #f3d49c;
  border-radius:999px;
  padding:7px 11px;
  font-size:14px;
}

.tag button{
  padding:0 0 0 7px;
  background:none;
  font-size:16px;
  color:#9a6b35;
}

.results{
  margin-top:20px;
  display:grid;
  gap:14px;
}

.result{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(255,138,61,.15);
  box-shadow:0 5px 18px rgba(80,50,20,.04);
}

.result:active{
  transform:scale(.99);
}

.result h3{
  font-size:21px;
  margin:0;
}

.result-missing{
  color:#a65d24;
  font-size:14px;
  margin-top:10px;
}

.result-all{
  color:var(--good);
  font-size:14px;
  font-weight:800;
  margin-top:10px;
}

.result-info{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.result-info span{
  background:#f7f2ea;
  border-radius:999px;
  padding:5px 10px;
  font-size:13px;
}

.result-arrow{
  text-align:right;
  color:#999;
  font-size:13px;
  margin-top:10px;
}

.favorite-button{width:100%;margin-top:12px;background:#fff0cf;color:#704600;}
.favorite-button.active{background:#ffe0df;color:#c04b45;}

.detail-page{
  display:none;
  margin-top:20px;
}

.detail-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(80,50,20,.06);
}








}




.detail-content{
  padding:22px;
}

.detail-title{
  font-size:30px;
  line-height:1.3;
  margin:0 0 12px;
}

.detail-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.detail-meta span{
  background:#f7f2ea;
  border-radius:999px;
  padding:6px 11px;
  font-size:13px;
}

.detail-section{
  margin-top:24px;
}

.detail-section h3{
  font-size:20px;
  margin:0 0 10px;
}

.ingredients-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  list-style:none;
  padding:0;
  margin:0;
}

.ingredients-list li{
  background:#fff0cf;
  border:1px solid #f3d49c;
  border-radius:999px;
  padding:7px 11px;
  font-size:14px;
}

.steps{
  margin:0;
  padding-left:24px;
}

.steps li{
  margin-bottom:10px;
}

.back-button{
  width:100%;
  background:#f1ece4;
  color:var(--ink);
  margin-top:24px;
  font-size:16px;
}






.empty{
  text-align:center;
  color:var(--muted);
  padding:20px;
}



.shopping-list{
  display:grid;
  gap:10px;
  margin-top:18px;
}

.shopping-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 14px;
  background:#fff7e8;
  border:1px solid var(--line);
  border-radius:15px;
  font-size:15px;
}

.shopping-item input{
  flex:0 0 auto;
  width:18px;
  height:18px;
  accent-color:var(--accent);
}

.shopping-empty{
  padding:18px;
  text-align:center;
  background:#f7f2ea;
  border-radius:16px;
  color:var(--muted);
}

@media(max-width:520px){

  h1{
    font-size:36px;
  }

  .logo{
    font-size:50px;
  }

  .inputrow{
    flex-wrap:wrap;
  }

  .inputrow input{
    flex-basis:100%;
  }

  .add{
    width:100%;
  }

  .card{
    padding:18px;
  }

  
  .detail-title{
    font-size:26px;
  }
}
</style>
</head>

<body>

<main class="wrap">

<section class="hero">
  <div class="logo">🥕</div>
  <h1>냉장고털이범</h1>
  <p>
    냉장고 속 재료를 입력하면<br>
    만들 수 있는 요리를 찾아드립니다.
  </p>

  <div class="nav-tabs">
    <button type="button" class="nav-tab active" id="homeTab">🍳 냉장고털이범</button>
    <button type="button" class="nav-tab" id="favoritesTab">❤️ 찜한 요리</button>
    <button type="button" class="nav-tab" id="shoppingTab">🛒 장보기</button>
  </div>
</section>


<section class="card">
  <h2>🥕 냉장고에 뭐가 있나요?</h2>

  <div class="inputrow">
    <input
      id="ingredientInput"
      placeholder="재료를 입력하세요"
      autocomplete="off"
    >
    <button type="button" class="add" id="addButton">＋ 추가</button>
  </div>

  <div id="tags" class="tags"></div>

  <button type="button" class="primary" id="findButton">
    🔪 냉장고 털기!
  </button>

  <button type="button" class="random" id="randomButton">
    🎲 아무거나 털어줘!
  </button>
</section>

<section id="results" class="results"></section>


<section id="detailPage" class="detail-page">

  <div class="detail-card">
<div class="detail-content">

      <h2 id="detailTitle" class="detail-title"></h2>

      <div id="detailMeta" class="detail-meta"></div>

      <button type="button" id="detailFavoriteButton" class="favorite-button">♡ 찜하기</button>

      <div class="detail-section">

        <h3>🥕 필요한 재료</h3>

        <ul
          id="detailIngredients"
          class="ingredients-list"
        ></ul>

      </div>


      <div class="detail-section">

        <h3>👩‍🍳 조리 방법</h3>

        <ol id="detailSteps" class="steps"></ol>

      </div>


      <button
        type="button"
        id="backButton"
        class="back-button"
      >
        ← 요리 목록으로 돌아가기
      </button>

    </div>

  </div>

</section>

<section id="favoritesPage" class="detail-page">
  <div class="detail-card"><div class="detail-content">
    <h2 class="detail-title">❤️ 찜한 요리</h2>
    <p class="help">찜해둔 요리를 모아볼 수 있어요.</p>
    <div id="favoritesList" class="results"></div>
    <button type="button" id="favoritesBackButton" class="back-button">← 냉장고털이범으로 돌아가기</button>
  </div></div>
</section>

<section id="shoppingPage" class="detail-page">
  <div class="detail-card">
    <div class="detail-content">
      <h2 class="detail-title">🛒 장보기</h2>
      <p class="help">선택한 요리에 필요한 재료를 확인할 수 있어요.</p>
      <div id="shoppingList" class="shopping-list"></div>
      <button type="button" id="shoppingBackButton" class="back-button">← 냉장고털이범으로 돌아가기</button>
    </div>
  </div>
</section>

</main>


<script>

/* =========================================================
   기본 데이터
   ========================================================= */

/* =========================================================
   기본 데이터
========================================================= */

const recipes=[

{
 name:"참치 계란볶음",
 emoji:"🍳",
 ingredients:["참치","계란","양파","대파"],
 time:"10분",
 level:"쉬움",
 steps:[
  "계란을 풀어준다.",
  "양파와 대파를 먹기 좋게 썬다.",
  "팬에 양파와 대파를 볶고 참치를 넣는다.",
  "계란물을 넣고 익혀준다.",
  "소금이나 간장으로 간을 맞춘다."
 ]
},

{
 name:"두부 계란부침",
 emoji:"🥚",
 ingredients:["두부","계란","대파"],
 time:"10분",
 level:"쉬움",
 steps:[
  "두부의 물기를 빼고 먹기 좋은 크기로 자른다.",
  "계란을 풀고 대파를 넣는다.",
  "두부에 계란물을 입힌다.",
  "팬에 앞뒤로 노릇하게 부친다."
 ]
},

{
 name:"닭가슴살 양배추볶음",
 emoji:"🥬",
 ingredients:["닭가슴살","양배추","양파","대파"],
 time:"15분",
 level:"쉬움",
 steps:[
  "양배추와 양파를 썬다.",
  "닭가슴살을 먹기 좋은 크기로 자른다.",
  "팬에 닭가슴살과 채소를 볶는다.",
  "소금, 후추 또는 간장으로 간한다."
 ]
},

{
 name:"김치 두부찌개",
 emoji:"🍲",
 ingredients:["김치","두부","대파","양파"],
 time:"20분",
 level:"보통",
 steps:[
  "김치와 양파를 냄비에 넣고 볶는다.",
  "물을 넣고 끓인다.",
  "두부를 넣고 5분 정도 끓인다.",
  "대파를 넣고 간을 맞춘다."
 ]
},

{
 name:"간장 계란밥",
 emoji:"🍚",
 ingredients:["계란","밥","대파"],
 time:"5분",
 level:"매우 쉬움",
 steps:[
  "계란을 프라이한다.",
  "따뜻한 밥 위에 계란을 올린다.",
  "간장과 참기름을 넣는다.",
  "대파를 올려 비벼 먹는다."
 ]
},

{
 name:"두부 김치볶음",
 emoji:"🥘",
 ingredients:["두부","김치","양파","대파"],
 time:"15분",
 level:"쉬움",
 steps:[
  "두부를 데치거나 구워 준비한다.",
  "김치와 양파를 볶는다.",
  "대파를 넣고 함께 볶는다.",
  "두부와 함께 담아낸다."
 ]
},

{
 name:"참치 김치볶음밥",
 emoji:"🍳",
 ingredients:["참치","김치","밥","대파","계란"],
 time:"15분",
 level:"쉬움",
 steps:[
  "대파를 볶아 향을 낸다.",
  "김치와 참치를 넣고 볶는다.",
  "밥을 넣고 골고루 볶는다.",
  "마지막에 계란 프라이를 올린다."
 ]
},

{
 name:"양배추 계란전",
 emoji:"🥬",
 ingredients:["양배추","계란","대파"],
 time:"10분",
 level:"쉬움",
 steps:[
  "양배추를 잘게 썬다.",
  "계란과 대파를 넣고 섞는다.",
  "팬에 한 국자씩 올린다.",
  "앞뒤로 노릇하게 부친다."
 ]
}

];

let ingredients=[];

let currentRecipe=null;
let favorites=JSON.parse(localStorage.getItem("fridgeThiefFavorites") || "[]");


/* =========================================================
   공통 함수
========================================================= */

function normalize(value){

 return String(value)
 .trim()
 .toLowerCase()
 .replace(/\s/g,"");

}


function renderTags(){

 const box=document.getElementById("tags");

 if(!ingredients.length){

  box.innerHTML="";
  return;

 }

 box.innerHTML=ingredients.map((item,index)=>`

  <span class="tag">

   ${item}

   <button
    type="button"
    data-remove="${index}"
   >×</button>

  </span>

 `).join("");

}


function addIngredient(){

 const input=document.getElementById("ingredientInput");

 const value=input.value.trim();

 if(!value){

  input.focus();
  return;

 }

 value
 .split(",")
 .map(v=>v.trim())
 .filter(Boolean)
 .forEach(v=>{

  if(
   !ingredients.some(
    x=>normalize(x)===normalize(v)
   )
  ){

   ingredients.push(v);

  }

 });

 input.value="";

 renderTags();

 input.focus();

}


function removeIngredient(index){

 ingredients.splice(index,1);

 renderTags();

}


function score(recipe){

 const have=ingredients.map(normalize);

 return recipe.ingredients.filter(
  x=>have.some(
   h=>
   h.includes(normalize(x)) ||
   normalize(x).includes(h)
  )
 ).length;

}


function getMissingIngredients(recipe){

 return recipe.ingredients.filter(
  x=>
  !ingredients.some(
   h=>
   normalize(h).includes(normalize(x)) ||
   normalize(x).includes(h)
  )
 );

}


function isFavorite(recipe){ return favorites.some(x=>x.name===recipe.name); }
function saveFavorites(){ localStorage.setItem("fridgeThiefFavorites",JSON.stringify(favorites)); }
function toggleFavorite(recipe){ if(!recipe)return; if(isFavorite(recipe)){favorites=favorites.filter(x=>x.name!==recipe.name);}else{favorites.push(recipe);} saveFavorites(); updateFavoriteButton(); renderFavorites(); renderResults(Array.from(document.querySelectorAll(".result")).map(el=>recipes[Number(el.dataset.index)]).filter(Boolean)); }
function updateFavoriteButton(){ const btn=document.getElementById("detailFavoriteButton"); if(!btn||!currentRecipe)return; const active=isFavorite(currentRecipe); btn.textContent=active?"♥ 찜 완료":"♡ 찜하기"; btn.classList.toggle("active",active); }
function renderFavorites(){ const box=document.getElementById("favoritesList"); if(!box)return; if(!favorites.length){box.innerHTML='<div class="card empty">❤️ 아직 찜한 요리가 없어요.</div>';return;} box.innerHTML=favorites.map(recipe=>{const index=recipes.findIndex(r=>r.name===recipe.name);return `<article class="result" data-index="${index}" tabindex="0"><h3>${recipe.emoji} ${recipe.name}</h3><div class="result-info"><span>⏱️ ${recipe.time}</span><span>👩‍🍳 ${recipe.level}</span></div><button type="button" class="favorite-button active" data-favorite-index="${index}">♥ 찜 완료</button><div class="result-arrow">자세히 보기 →</div></article>`;}).join(""); }
function openFavorites(){ document.getElementById("detailPage").style.display="none"; document.getElementById("shoppingPage").style.display="none"; document.getElementById("results").style.display="none"; document.getElementById("favoritesPage").style.display="block"; document.querySelectorAll(".nav-tab").forEach(btn=>btn.classList.remove("active")); document.getElementById("favoritesTab").classList.add("active"); renderFavorites(); window.scrollTo({top:0,behavior:"smooth"}); }
function closeFavorites(){ document.getElementById("favoritesPage").style.display="none"; document.getElementById("results").style.display="grid"; document.querySelectorAll(".nav-tab").forEach(btn=>btn.classList.remove("active")); document.getElementById("homeTab").classList.add("active"); window.scrollTo({top:0,behavior:"smooth"}); }

/* =========================================================
   요리 검색
========================================================= */

function findRecipes(){

 if(!ingredients.length){

  document.getElementById("results").innerHTML=
  '<div class="card empty">🥷 먼저 냉장고 재료를 입력해주세요!</div>';

  return;

 }

 closeDetail();

 const ranked=

 recipes
 .map(r=>({...r,matched:score(r)}))
 .filter(r=>r.matched>0)
 .sort((a,b)=>b.matched-a.matched);

 renderResults(ranked.slice(0,6));

 document
 .getElementById("results")
 .scrollIntoView({
  behavior:"smooth",
  block:"start"
 });

}


function randomRecipe(){

  closeDetail();

  const r=
  recipes[Math.floor(Math.random()*recipes.length)];

  renderResults([r]);

  document
    .getElementById("results")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


function renderResults(list){

 const results=document.getElementById("results");

 if(!list.length){

  results.innerHTML=
  '<div class="card empty">🥷 털 수 있는 요리를 못 찾았어요.<br>재료를 조금 더 추가해보세요!</div>';

  return;

 }

 results.innerHTML=list.map(recipe=>{

  const missing=getMissingIngredients(recipe);

  const index=recipes.findIndex(
   r=>r.name===recipe.name
  );

  return `

  <article
   class="result"
   data-index="${index}"
   tabindex="0"
  >

   <h3>
    ${recipe.emoji} ${recipe.name}
   </h3>

   ${
    missing.length
    ?
    `<div class="result-missing">
      🛒 부족한 재료: ${missing.join(", ")}
     </div>`
    :
    `<div class="result-all">
      🎉 필요한 재료를 모두 가지고 있어요!
     </div>`
   }

   <div class="result-info">

    <span>⏱️ ${recipe.time}</span>

    <span>👩‍🍳 ${recipe.level}</span>

   </div>

   <button type="button" class="favorite-button ${isFavorite(recipe)?"active":""}" data-favorite-index="${index}">${isFavorite(recipe)?"♥ 찜 완료":"♡ 찜하기"}</button>

   <div class="result-arrow">
    자세히 보기 →
   </div>

  </article>

  `;

 }).join("");

}


/* =========================================================
   상세 페이지
========================================================= */

function openDetail(index){

 const recipe=recipes[index];

 if(!recipe)return;

 currentRecipe=recipe;
 document.getElementById("shoppingPage").style.display="none";
 document.getElementById("favoritesPage").style.display="none";
 document.querySelectorAll(".nav-tab").forEach(btn=>btn.classList.remove("active"));
 document.querySelector(".nav-tab").classList.add("active");


 document
 .getElementById("detailTitle")
 .textContent=
 recipe.emoji+" "+recipe.name;


 document
 .getElementById("detailMeta")
 .innerHTML=`

  <span>
   ⏱️ 조리시간 ${recipe.time}
  </span>

  <span>
   👩‍🍳 난이도 ${recipe.level}
  </span>

 `;


 updateFavoriteButton();

 document
 .getElementById("detailIngredients")
 .innerHTML=
 recipe.ingredients
 .map(x=>`<li>${x}</li>`)
 .join("");


 document
 .getElementById("detailSteps")
 .innerHTML=
 recipe.steps
 .map(x=>`<li>${x}</li>`)
 .join("");


 document
 .getElementById("results")
 .style.display="none";


 document
 .getElementById("detailPage")

function closeDetail(){

 currentRecipe=null;
 document.getElementById("shoppingPage").style.display="none";
 document.getElementById("favoritesPage").style.display="none";
 document.querySelectorAll(".nav-tab").forEach(btn=>btn.classList.remove("active"));
 document.querySelector(".nav-tab").classList.add("active");

 document
 .getElementById("detailPage")
 .style.display="none";

 document
 .getElementById("results")
 .style.display="grid";

}


/* =========================================================
   장보기 화면
========================================================= */

function openShopping(){

 document.getElementById("detailPage").style.display="none";
 document.getElementById("results").style.display="none";
 document.getElementById("shoppingPage").style.display="block";

 const list=document.getElementById("shoppingList");

 if(!currentRecipe){
  list.innerHTML='<div class="shopping-empty">🥕 먼저 요리를 검색하거나 아무거나 털어줘에서 요리를 선택해주세요.</div>';
 }else{
  const missing=getMissingIngredients(currentRecipe);
  list.innerHTML=missing.length
   ? missing.map(item=>`<label class="shopping-item"><input type="checkbox"> 🛒 ${item}</label>`).join("")
   : '<div class="shopping-empty">🎉 이 요리는 필요한 재료를 모두 가지고 있어요!</div>';
 }

 window.scrollTo({top:0,behavior:"smooth"});
}

function closeShopping(){
 document.getElementById("shoppingPage").style.display="none";
 document.getElementById("results").style.display="grid";
 document.querySelectorAll(".nav-tab").forEach(btn=>btn.classList.remove("active"));
 document.querySelector(".nav-tab").classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
}


/* =========================================================
   시작
========================================================= */

document.addEventListener(
 "DOMContentLoaded",
 async()=>{

  document
   .getElementById("addButton")
   .addEventListener(
    "click",
    addIngredient
   );


  document
   .getElementById("findButton")
   .addEventListener(
    "click",
    findRecipes
   );


  document
   .getElementById("randomButton")
   .addEventListener(
    "click",
    randomRecipe
   );


  document.getElementById("favoritesTab").addEventListener("click",openFavorites);
  document.getElementById("homeTab").addEventListener("click",closeFavorites);
  document.getElementById("detailFavoriteButton").addEventListener("click",()=>toggleFavorite(currentRecipe));
  document.getElementById("favoritesBackButton").addEventListener("click",closeFavorites);

  document
   .getElementById("shoppingTab")
   .addEventListener(
    "click",
    openShopping
   );


  document
   .getElementById("backButton")
   .addEventListener(
    "click",
    closeDetail
   );


  document
   .getElementById("shoppingBackButton")
   .addEventListener(
    "click",
    closeShopping
   );


  document
   .getElementById("ingredientInput")
   .addEventListener(
    "keydown",
    e=>{

     if(e.key==="Enter"){

      e.preventDefault();

      addIngredient();

     }

    }
  );


  document
   .getElementById("tags")
   .addEventListener(
    "click",
    e=>{

     const btn=
     e.target.closest(
      "[data-remove]"
     );

     if(btn){

      removeIngredient(
       Number(btn.dataset.remove)
      );

     }

    }
  );


  document
   .getElementById("results")
   .addEventListener(
    "click",
    e=>{

     const favoriteButton=e.target.closest("[data-favorite-index]");
     if(favoriteButton){ e.stopPropagation(); toggleFavorite(recipes[Number(favoriteButton.dataset.favoriteIndex)]); return; }

     if(e.target.closest("[data-favorite-index]"))return;

     const card=
     e.target.closest(".result");

     if(card){

      openDetail(
       Number(card.dataset.index)
      );

     }

    }
  );


  document.getElementById("favoritesList").addEventListener("click",e=>{
    const favoriteButton=e.target.closest("[data-favorite-index]");
    if(favoriteButton){e.stopPropagation();toggleFavorite(recipes[Number(favoriteButton.dataset.favoriteIndex)]);return;}
    const card=e.target.closest(".result");
    if(card)openDetail(Number(card.dataset.index));
  });

  document
   .getElementById("results")
   .addEventListener(
    "keydown",
    e=>{

     if(
      e.key!=="Enter" &&
      e.key!==" "
     )return;

     const card=
     e.target.closest(".result");

     if(card){

      e.preventDefault();

      openDetail(
       Number(card.dataset.index)
      );

     }

    }
  );


  renderTags();
  renderFavorites();


 }
);

</script>

</body>
</html>
